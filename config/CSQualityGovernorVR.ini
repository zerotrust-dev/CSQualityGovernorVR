; CS Quality Governor VR - cycler configuration
; Install to: Data/SKSE/Plugins/CSQualityGovernorVR.ini
;
; The cycler exists to produce one complete dataset per game session, so you do
; not have to sit and watch. Results land NEXT TO THE SKSE LOG, in:
;   Documents/My Games/Skyrim VR/SKSE/CSQualityGovernorVR/
;
; Deliberately not under Data/: through Mod Organizer's virtual filesystem those
; writes land in Overwrite, which is easy to miss and easy to lose.
;
; The sweep starts automatically 20 s after a SAVE FINISHES LOADING (see
; StartDelaySeconds). So to measure a specific spot: travel there, save, then
; LOAD that save - otherwise the sweep is already running while you travel.

[General]
; Start automatically once the save is loaded. Set to 0 to require the hotkey.
AutoStart = 1
; DirectInput scan code. 0x58 = F12.
Hotkey = 0x58

; Your headset refresh rate. The frame budget is 1000/TargetHz.
; Getting this wrong makes every miss-rate figure meaningless.
TargetHz = 72

[Output]
WriteCsv = 1
; Per-frame trace. Large - tens of thousands of rows - but the only way to see
; the shape of a transition rather than its summary.
;
; ON by default since 2026-08-06, because two things now need it and neither
; works from the 2 Hz apistate samples:
;   - D-10b judges headroom on P95 GPU time, which needs the distribution.
;   - The D-13 acceptance test joins this file against OpenXR-Toolkit's stats
;     CSV on wall_ms, and that file writes ten rows per second.
WritePerFrameCsv = 1
LogToFile = 1

; Keep recording after the sweep finishes, for the rest of the play session.
; The preset is left alone from then on - this only records.
;
; Without it the capture is just the sweep window. On 2026-08-06 that was 4m38s
; of a session that continued long afterwards, and a 34% headroom reading seen
; while playing had no counterpart in our data to compare against.
MonitorAfterSweep = 1

; Run the controller alongside everything else, recording what it WOULD do
; without doing any of it. Every evaluation lands in *_timeline.csv - including
; the ones that decided to hold, because "why did it not act" is as much a
; question as "why did it act".
;
; There is no setting that lets it act. That is a separate change with its own
; test phase, not a flag.
ShadowGovernor = 1
WriteTimelineCsv = 1

; Let the controller actually change the preset, once the sweep has finished.
; Phase 5. Off by default: turning the observer on is free, turning the actuator
; on is not, and they are deliberately not the same switch.
;
; It never acts during the sweep - the cycler owns the lever until then, and two
; owners on one lever is a failure this project has met more than once. While
; CS refuses changes the latest target is buffered and retried; a terminal block
; (OpenComposite upscaling) disables it for the session with one log line.
;
; Every decision lands in *_timeline.csv with its outcome: applied, deferred,
; shadow, readback-mismatch or terminal-block.
;
; Currently 1: first live runs. Ship as 0.
ApplyGovernor = 1

; The Community Shaders build the preset ladder was verified against.
;
; The plugin hardcodes each quality mode's resolution scale, copied by hand from
; CS's Upscaling.h, because the VR API can set and get the preset but cannot
; report its scale. Every pixel fraction and every score rests on that table, so
; a CS update can invalidate all of it without anything looking wrong.
;
; This does not check the scales - nothing available can. It checks that CS is
; the build they were read from, which turns a silent wrong number into a loud
; refusal. When a new MGO release candidate ships a newer CS: re-read the scales
; from that build's Upscaling.h, update Presets.h if they moved, then set this to
; the new build number.
;
; 0 disables the check entirely.
VerifiedCsBuild = 9

; What to do when the build does not match. 1 refuses to apply preset changes
; and keeps recording; 0 continues and marks the session's captures suspect in
; the log. Refusing is the default because wrong pixel fractions do not announce
; themselves.
RequireVerifiedCsBuild = 1

; The build whose vtable actually carries our GPU timing methods.
;
; Separate from VerifiedCsBuild on purpose, because the two facts are
; independent. CSX 3.18 reports build 11 and its resolution scales are
; IDENTICAL to ours (verified against GetQualityModeResolutionScale in the
; csx-3-VR source), so the ladder is verified and VerifiedCsBuild = 11 is
; correct there - but it has no GPU timing methods at all, and calling them
; crashes the game. One number cannot mean both "the scales are right" and
; "our fork's vtable is present".
;
; Only ever set this to a build of OUR forked Community Shaders. Set it to 0
; to disable GPU timing entirely and run on the frametime tier.
;
; Known builds:
;   9   our fork (PL3.15 + the frame GPU timer)  -> timing available
;   11  CSX 3.18-VR, stock                       -> NO timing, do not set
GpuTimingCsBuild = 9

; Measure GPU time from our own compositor hooks instead of from a forked
; Community Shaders (D-21).
;
; The brackets go in the same two places the fork put them - opened when
; IVRCompositor::WaitGetPoses returns, closed at Submit - because that placement
; is what makes the number real rather than a re-measurement of frametime. Doing
; it here means it works against whatever CS the modlist ships, so there is no
; fork to rebase every release candidate and no chance of the vtable collision
; that crashed the game on CSX 3.18.
;
; Turn this off only to fall back to a forked CS. With it off and no fork
; installed, the controller runs on the censored frametime tier where four
; presets all read 13.9 ms, and every climb becomes a blind probe.
UseOwnGpuTimer = 1

; The CS build confirmed to carry the transition-profile API (D-22).
;
; CSX 3.18 expects external controllers to preflight a change with
; GetVRUpscalingTransitionProfileDecision and, when it answers kApply, to
; schedule the door fade and call SetVRUpscalingTransitionProfileForMethod.
; Setting the preset directly instead changes the render scale with no fade, so
; the relatch is visible as a gridded panel for a split second on every change.
;
; EXACT match only, and this one is not negotiable. That preflight sits at vtable
; slot 23, which in the forked Community Shaders is GetLastFrameGpuTimeUs - and
; both builds report themselves as revision 4. Nothing but the build number
; distinguishes them, and calling the wrong one crashes the game at startup.
;
; Known builds:
;   11  CSX 3.18-VR  -> has the transition API
;    9  our fork     -> does NOT; slot 23 is the GPU timer
;
; 0 disables it and falls back to SetUpscalePreset.
TransitionApiCsBuild = 11

; Frames to withhold across a preset change (D-23).
;
; Changing the quality mode reallocates every render target. For a frame or two
; there is nothing valid to present, and the headset shows whatever is in that
; memory - the gridded panel. This was always true; PL3.15's white flash was a
; bug that happened to paint over it, and fixing the flash exposed it.
;
; While the hold is armed we simply do not hand the frame to the runtime. An
; application that does not submit gets its previous frame reprojected to the
; current head pose, so this reads as a brief hitch rather than a garbage frame.
;
; Measured rather than guessed. A preset change costs a ~85 ms stall plus a
; frame doing 66-86 ms of GPU work - the relatch itself - and takes 10-11 frames
; to return to normal frametime. Counting from the moment we apply: frames 1-3
; are still valid old-preset frames, 4-6 are the stall and the relatch, 7-10 are
; valid but slow. 8 covers the bad ones with margin without withholding the
; recovery. RC2 and RC3 measure identically here - only the appearance differed.
; 0 disables it.
TransitionHoldFrames = 8

; Circuit breaker. If the governor applies more changes than this in any rolling
; minute it disables itself for the session and leaves the preset alone.
;
; Replay predicts 2-3 a minute, so double digits means something is wrong rather
; than merely aggressive. There is no in-game way to stop the governor and
; editing this file from inside a headset is not an option, so it has to be able
; to stop itself.
MaxChangesPerMinute = 12

; --- SIMPLE MODE: an instrument for judging the ladder by eye ---
;
; The whole rule: go up one preset when overhead reaches SimpleClimbHeadroomPct,
; go down one preset when fps falls below SimpleDescendFps. Nothing else. No
; landing prediction, no cost model, no failure memory, no probes.
;
; It exists because "whenever I see 15-20% overhead I think we are ok to go up
; one preset" is a question about what the result LOOKS like, and no amount of
; replay can answer that. This lets the person wearing the headset judge.
;
; IMPORTANT - which number it reads. The percentage is measured against MEAN GPU
; time over the decision window, which is exactly what the [readout] line in the
; log prints. So the number you see is the number it acts on. The normal
; controller decides on P95 instead, which is stricter, and the two can differ by
; more than a rung's worth.
;
; That same choice is why this is not a shipping controller: the mean hides the
; tail, and a locked framerate is lost at the tail, not on average. Measured
; 2026-08-12, one rung apart in the same scene: UltraPerformance 2.4% late
; frames, Performance 5.9%. Both look fine as a mean.
;
; Ship as 0.
SimpleMode = 0

; Overhead at or above this (percent of frame budget) climbs one preset.
; Try 20 first, then 15 if it feels too timid and 25 if it overshoots.
SimpleClimbHeadroomPct = 20

; Windowed mean fps below this descends one preset.
SimpleDescendFps = 70

; Preset to select once the sweep finishes and monitoring starts, by PUBLIC
; value (0 NativeAA, 1 Quality, 2 Balanced, 3 Performance, 4 UltraPerformance,
; 5 Hoshipa, 6 UltraQuality). -1 leaves whatever the sweep ended on.
;
; The sweep ends on the cheapest rung, so free play afterwards sits far below
; the budget and never exercises the region where the thresholds decide - 71% of
; the 2026-08-08 session had over 30% headroom for that reason alone.
;
; Currently 1 (Quality), to gather the marginal-load coverage the thresholds
; were fitted without. The replay report's fixed-preset table decides this, not
; taste: across the 2026-08-08 session Quality projects to 2.4% of frames over
; budget, UltraQuality to 20.4% and Hoshipa to 58.3%. Quality holds a mean GPU
; time near 11.7 ms, inside the decision band of 10.9-13.9 ms, and crosses the
; budget occasionally - which is the regime the thresholds need and the others
; overshoot into simply dropping frames.
;
; Set back to -1 once that coverage exists.
MonitorPreset = 1

[Sweep]
; Minimum seconds after a save finishes loading before the first change. This is
; a floor, not the whole gate - see StartMaxWaitSeconds.
StartDelaySeconds = 20

; After the floor above, the sweep additionally waits until CS actually accepts
; changes, giving up after this long so a permanently blocked session still
; produces something.
;
; A fixed delay cannot do this job. CS keeps kLoadingMenu asserted long after
; the game is playable, and for a wildly variable time: 31 s on 2026-08-04 but
; 115 s on 2026-08-05, from the same save, with frames running at a steady 14 ms
; throughout. Raising the fixed delay to 45 s still lost the first three visits
; of sweep 0. Waiting on the API instead costs nothing when it is quick.
StartMaxWaitSeconds = 300

; Steady-state sampling time per preset, after frametime has settled.
; 8 s is ~575 frames at 72 Hz, which is ample for a P95. Raising this makes the
; run longer without making the percentile meaningfully better - and standing
; still in VR for the whole run is the real constraint.
DwellSeconds = 8

; Give up waiting for a stable frametime after this long and record anyway.
; A preset that never settles is itself a result.
SettleTimeoutSeconds = 8

; Full passes over the preset ladder. More than one is what separates a real
; difference from run-to-run noise.
;
; KEEP THIS EVEN. Odd sweeps run the ladder backwards, which only cancels
; session drift if both directions are equally represented. With 3 sweeps a
; preset's average time-position still depends on where it sits in the ladder,
; so drift leaks back into the ranking. 4 works; 3 quietly does not.
Sweeps = 4

; Presets to visit, by PUBLIC API value, cheapest first by default:
;   0 NativeAA/DLAA   1 Quality    2 Balanced   3 Performance
;   4 UltraPerformance  5 Hoshipa  6 UltraQuality
; NOTE: these are NOT the CS-internal numbers. See docs/CS_PLUGIN_API.md.
; Default order below is 4,3,2,1,6,5,0 - cheapest to most expensive.
Order = 4,3,2,1,6,5,0

[Settle]
; Consecutive in-band frames required before frametime counts as settled.
SettleMinSamples = 30
; Frames skipped immediately after a change, to ignore the transition spike
; itself (DLSS history reset and resource work).
SettleWarmupSamples = 5
; Band half-width around the running median, in milliseconds.
SettleToleranceMs = 1.5

[Blocking]
; How often to retry while CS refuses an apply.
RetryIntervalSeconds = 0.5
; Abandon a preset that stays blocked this long and move on, rather than
; stalling the whole sweep.
BlockGiveUpSeconds = 30

; --- ADAPTIVE MODE (D-25 + D-26): the controller this project arrived at ---
;
; Two rules, and nothing between the measurement and the decision:
;
;   climb    when spare P95 GPU time clears what the next rung actually costs,
;            plus your margin, and nothing has gone wrong for a while
;   descend  when frames genuinely arrive late
;
; Why descend on late frames rather than on GPU time: measured over two
; sessions, 92% of late frames had spare GPU time by our own instrument. GPU
; time cannot see most of what makes frames late (E-49), and both explanations
; we chased for that turned out to be dead ends (E-55, E-56). So GPU time
; proposes and frame delivery disposes.
;
; Takes precedence over SimpleMode when both are on.
AdaptiveMode = 0

; The margin, in percent of the frame budget, ON TOP of what a rung costs.
;
; THIS IS THE ONLY NUMBER WORTH TUNING, and it is a genuine preference: how much
; safety do you want before spending headroom on quality. The price of each rung
; is measured by the calibration sweep on YOUR machine, every session, so it
; already accounts for headset resolution, render scale, GPU, driver and scene.
;
; That is why this is a margin and not a threshold. A raw threshold needs a
; different value on every rung and every system: measured here, one rung costs
; 15.1% of budget and another 10.4%. Asking for "20%" happens to work at the
; bottom of the ladder and is far too generous at the top.
;
; Evidence for 5: a hand-set 20% held steadily where a hand-set 14% hunted, and
; the rung in question costs 15.1% - so 20% was the price plus about 5, and 14%
; was a bid below the asking price (E-57). Larger is more conservative.
ClimbMarginPct = 5

; Descend when more than this percent of a 2-second window arrives late.
;
; A frame is late past budget x 1.05. Note that value lands between points on
; the 1/6 ms measurement grid, so the operative threshold is the next one up
; (E-56) - tuning this more finely than that changes nothing.
;
; Measured for reference: at Performance ~4.2% of frames run late, at
; UltraPerformance ~0.2%. So 5 keeps Performance holdable; lower and the
; controller will refuse to stay there.
DescendMissRatePct = 5

; Seconds of clean running required before any climb is considered. Stops the
; controller climbing straight back into a rung it just descended from.
ClimbCleanSeconds = 8
