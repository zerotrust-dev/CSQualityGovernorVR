; CS Quality Governor VR - cycler configuration
; Install to: Data/SKSE/Plugins/CSQualityGovernorVR.ini
;
; The cycler exists to produce one complete dataset per game session, so you do
; not have to sit and watch. Results land NEXT TO THE SKSE LOG, in:
;   Documents/My Games/Skyrim VR/SKSE/CSQualityGovernorVR/
;
; Deliberately not under Data/: through Mod Organizer's virtual filesystem those
; writes land in Overwrite, which is easy to miss and easy to lose.
;
; The sweep starts automatically 20 s after a SAVE FINISHES LOADING (see
; StartDelaySeconds). So to measure a specific spot: travel there, save, then
; LOAD that save - otherwise the sweep is already running while you travel.

[General]
; Start automatically once the save is loaded. Set to 0 to require the hotkey.
AutoStart = 1
; DirectInput scan code. 0x58 = F12.
Hotkey = 0x58

; Your headset refresh rate. The frame budget is 1000/TargetHz.
; Getting this wrong makes every miss-rate figure meaningless.
TargetHz = 72

[Output]
WriteCsv = 1
; Per-frame trace. Large - tens of thousands of rows - but the only way to see
; the shape of a transition rather than its summary.
WritePerFrameCsv = 0
LogToFile = 1

[Sweep]
; Minimum seconds after a save finishes loading before the first change. This is
; a floor, not the whole gate - see StartMaxWaitSeconds.
StartDelaySeconds = 20

; After the floor above, the sweep additionally waits until CS actually accepts
; changes, giving up after this long so a permanently blocked session still
; produces something.
;
; A fixed delay cannot do this job. CS keeps kLoadingMenu asserted long after
; the game is playable, and for a wildly variable time: 31 s on 2026-08-04 but
; 115 s on 2026-08-05, from the same save, with frames running at a steady 14 ms
; throughout. Raising the fixed delay to 45 s still lost the first three visits
; of sweep 0. Waiting on the API instead costs nothing when it is quick.
StartMaxWaitSeconds = 300

; Steady-state sampling time per preset, after frametime has settled.
; 8 s is ~575 frames at 72 Hz, which is ample for a P95. Raising this makes the
; run longer without making the percentile meaningfully better - and standing
; still in VR for the whole run is the real constraint.
DwellSeconds = 8

; Give up waiting for a stable frametime after this long and record anyway.
; A preset that never settles is itself a result.
SettleTimeoutSeconds = 8

; Full passes over the preset ladder. More than one is what separates a real
; difference from run-to-run noise.
;
; KEEP THIS EVEN. Odd sweeps run the ladder backwards, which only cancels
; session drift if both directions are equally represented. With 3 sweeps a
; preset's average time-position still depends on where it sits in the ladder,
; so drift leaks back into the ranking. 4 works; 3 quietly does not.
Sweeps = 4

; Presets to visit, by PUBLIC API value, cheapest first by default:
;   0 NativeAA/DLAA   1 Quality    2 Balanced   3 Performance
;   4 UltraPerformance  5 Hoshipa  6 UltraQuality
; NOTE: these are NOT the CS-internal numbers. See docs/CS_PLUGIN_API.md.
; Default order below is 4,3,2,1,6,5,0 - cheapest to most expensive.
Order = 4,3,2,1,6,5,0

[Settle]
; Consecutive in-band frames required before frametime counts as settled.
SettleMinSamples = 30
; Frames skipped immediately after a change, to ignore the transition spike
; itself (DLSS history reset and resource work).
SettleWarmupSamples = 5
; Band half-width around the running median, in milliseconds.
SettleToleranceMs = 1.5

[Blocking]
; How often to retry while CS refuses an apply.
RetryIntervalSeconds = 0.5
; Abandon a preset that stays blocked this long and move on, rather than
; stalling the whole sweep.
BlockGiveUpSeconds = 30
