name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The core is deliberately free of SKSE, Skyrim SDK and Windows dependencies,
  # so this job is fast, deterministic, and runs everywhere. Two compilers
  # because MSVC has already accepted something GCC correctly rejected.
  core-tests:
    name: Core unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # This job normally finishes in about 90 seconds. On 2026-08-06 the Linux
    # leg sat 15 minutes in the queue twice and was cancelled with steps=0 and
    # no runner assigned - it never started, so nothing here was at fault. The
    # image is pinned rather than tracking the `latest` alias, which is where
    # that allocation went wrong.
    #
    # timeout-minutes bounds execution, not queue time, so it does not prevent
    # a repeat. It is here for the case the alias-pinning does not cover: a
    # test that genuinely hangs.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCSGOV_BUILD_TESTS=ON -DCSGOV_BUILD_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      # --timeout kills an individual hanging test and names it, rather than
      # letting the job run to its own limit and die anonymously.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 60

  # Bootstrap pattern copied from the sibling HeadDirectedTurning repo, which
  # builds green. The pinned vcpkg commit must match the baseline in
  # vcpkg-configuration.json.
  plugin:
    name: Build SKSE plugin
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          Set-Location "$env:RUNNER_TEMP\vcpkg"
          git checkout a0400024711b283056538ac19ced80b91a83c24c
          .\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache built dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/release-vr/vcpkg_installed
            ${{ runner.temp }}/vcpkg/downloads
          key: vcpkg-windows-2022-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Configure
        shell: pwsh
        run: cmake --preset release-vr

      - name: Build
        shell: pwsh
        run: cmake --build --preset release-vr

      # An SKSE plugin that imports spdlog.dll or fmt.dll builds fine and is
      # then rejected by the game with Error 126. That is invisible until
      # someone loads a save, so it is checked here instead.
      - name: Verify the plugin has no unshipped dependencies
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build/release-vr -Recurse -Filter CSQualityGovernorVR.dll |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dll) { throw "CSQualityGovernorVR.dll was not produced" }
          ./tools/Check-PluginImports.ps1 -Path $dll

      - name: Package
        shell: pwsh
        run: |
          $out = "artifacts/CSQualityGovernorVR"
          New-Item -ItemType Directory -Force -Path "$out/SKSE/Plugins" | Out-Null
          $dll = Get-ChildItem -Path build/release-vr -Recurse -Filter CSQualityGovernorVR.dll |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dll) { throw "CSQualityGovernorVR.dll was not produced" }
          Copy-Item -LiteralPath $dll -Destination "$out/SKSE/Plugins/"
          Copy-Item -Path "config/CSQualityGovernorVR.ini" -Destination "$out/SKSE/Plugins/"
          Copy-Item -Path "docs/RUNNING.md" -Destination "$out/" -ErrorAction SilentlyContinue

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CSQualityGovernorVR-plugin
          path: artifacts/CSQualityGovernorVR/
